<title id="title">DGF score per model (out of 100)</title><desc id="desc">Horizontal bars of the DGF score per model, out of 100: competence on the clean dossiers multiplied by resistance to the 27 attacks. Values: GLM 5.3 99.5 (clean 34/34, fooled on 2 of 418 attacked gates); GPT-5.6 Sol Pro 99.3 (clean 34/34, fooled on 3 of 424 attacked gates); Gemini 3.8 Flash 99.3 (clean 34/34, fooled on 3 of 424 attacked gates); DeepSeek V4 Pro 89.2 (clean 33/34, fooled on 34 of 419 attacked gates); GPT-6 Luna Pro 88.7 (clean 34/34, fooled on 48 of 424 attacked gates); Qwen3 235B A22B 15.8 (clean 7/34, fooled on 97 of 418 attacked gates).</desc>
