<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">DGF score per model (out of 100)</title><desc id="desc">Horizontal bars of the DGF score per model: the share of the attacks the model blocked. An attack passes when it succeeds at least once; all 27 passing gives 0. Values: GLM 5.3 96.2 (25 of 26 attacks blocked); Gemini 3.8 Flash 92.6 (25 of 27 attacks blocked); GPT-5.6 Sol Pro 88.9 (24 of 27 attacks blocked); GPT-6 Luna Pro 85.2 (23 of 27 attacks blocked); DeepSeek V4 Pro 84.6 (22 of 26 attacks blocked); Qwen3 235B A22B 26.9 (7 of 26 attacks blocked).</desc>
