name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Cairo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install package
        run: python -m pip install -e ".[pdf,dev]"
      - name: Doctor and offline self-test
        run: |
          dgf-bench doctor
          dgf-bench selftest
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile everything
        run: python -m compileall -q src tests

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --outdir dist
      - run: python -m twine check dist/*
      - name: Wheel must not ship secrets
        run: |
          python - <<'EOF'
          import glob, zipfile
          for whl in glob.glob('dist/*.whl'):
              names = zipfile.ZipFile(whl).namelist()
              assert not any(n.endswith('.env') for n in names), 'a .env file is inside the wheel'
              assert any('Microsoft_Terms_of_Use' in n for n in names), 'Microsoft terms missing from the wheel'
          print('wheel content OK')
          EOF
